<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业微信消息构建器</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e6eb; --text:#1f2329;
    --muted:#8a9099; --brand:#0a6cff; --brand-weak:#eaf2ff;
    --ok:#12b76a; --warn:#f79009; --danger:#f04438;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;flex:1;min-width:180px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-size:13px;transition:.15s;color:var(--text)}
  button:hover{border-color:var(--brand);color:var(--brand)}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.primary:hover{opacity:.9;color:#fff}
  button.mini{padding:3px 8px;font-size:12px;border-radius:6px}
  button.danger{color:var(--danger);border-color:#ffd6d3}
  button.danger:hover{background:#fff2f1;color:var(--danger)}
  main{display:grid;grid-template-columns:minmax(440px,1fr) minmax(420px,1fr);gap:16px;padding:16px;align-items:start}
  @media(max-width:980px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .panel h2 .tag{font-size:11px;color:var(--muted);font-weight:400}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=url],input[type=number],textarea,select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;background:#fff;color:var(--text)
  }
  textarea{resize:vertical;min-height:64px;font-family:ui-monospace,Menlo,Consolas,monospace}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-weak)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center}
  .sub{border:1px dashed var(--line);border-radius:10px;padding:10px;margin:10px 0;background:#fbfcfd}
  .sub-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .sub-head b{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .preview-wrap{background:#f5f6f8;border-radius:10px;padding:16px;min-height:200px}
  .wx-card{background:#fff;border-radius:12px;overflow:hidden;max-width:420px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:14px}
  .wx-card .src{display:flex;align-items:center;gap:6px;padding:12px 16px 0;font-size:12px;color:var(--muted)}
  .wx-card .src .dot{width:14px;height:14px;border-radius:3px;background:#d0d5dd}
  .wx-card .body{padding:10px 16px 14px}
  .wx-card .title{font-size:16px;font-weight:600;line-height:1.4}
  .wx-card .desc{font-size:12px;color:var(--muted);margin-top:2px}
  .wx-card .subtitle{font-size:13px;color:#4b5563;margin-top:10px}
  .wx-card .emphasis{margin:12px 0}
  .wx-card .emphasis .num{font-size:26px;font-weight:700;line-height:1}
  .wx-card .emphasis .cap{font-size:12px;color:var(--muted);margin-top:2px}
  .wx-card .quote{background:#f7f8fa;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px}
  .wx-card .quote .qt{color:var(--muted);font-size:12px;margin-bottom:4px}
  .wx-card .hlist{margin-top:10px}
  .wx-card .hlist .hrow{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
  .wx-card .hlist .hrow .k{color:var(--muted)}
  .wx-card .hlist .hrow .v{color:var(--brand);max-width:65%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wx-card .vlist{margin-top:10px}
  .wx-card .vlist .vrow{padding:6px 0}
  .wx-card .vlist .vt{font-weight:600;font-size:13px}
  .wx-card .vlist .vd{font-size:12px;color:var(--muted);margin-top:2px}
  .wx-card .cardimg{width:100%;display:block}
  .wx-card .ita{display:flex;gap:10px;padding:10px 16px}
  .wx-card .ita img{width:56px;height:56px;border-radius:6px;object-fit:cover;flex:none}
  .wx-card .ita .t{font-size:13px;font-weight:600}
  .wx-card .ita .d{font-size:12px;color:var(--muted);margin-top:2px}
  .wx-card .jlist{border-top:1px solid #f0f1f3;margin-top:12px}
  .wx-card .jlist a{display:block;padding:10px 16px;font-size:13px;color:var(--brand);text-decoration:none;border-bottom:1px solid #f0f1f3}
  .wx-card .jlist a:last-child{border-bottom:none}
  .wx-md{background:#fff;border-radius:10px;padding:14px 16px;max-width:420px;font-size:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .wx-md b{font-weight:600}
  .wx-md .mquote{color:var(--muted);border-left:3px solid #e3e6eb;padding-left:8px;display:block;margin:2px 0}
  .wx-md .mlink{color:var(--brand)}
  .wx-md .mcode{background:#f2f3f5;border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .wx-md .mgreen{color:#12b76a}.wx-md .mgray{color:#8a9099}.wx-md .mred{color:#f04438}
  .wx-img{max-width:240px;border-radius:10px;display:block}
  pre.json{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;overflow:auto;max-height:420px;margin:0}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .imgpick{display:flex;align-items:flex-start;gap:10px;margin-top:6px}
  .imgpick img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff;flex:none}
  .imgpick .ph{width:64px;height:64px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;flex:none}
  .imgpick input[type=file]{font-size:12px;margin-top:6px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2329;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .seg button{font-size:12px;padding:6px 10px}
  .seg button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
  .checkbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
  .checkbox input{width:auto}
</style>
</head>
<body>

<header>
  <h1>📨 企业微信消息构建器</h1>
  <label class="checkbox" style="margin:0">
    <input type="checkbox" id="uploadEnabled" onchange="toggleUpload()"> 启用上传换 URL
  </label>
  <input type="text" id="uploadEndpoint" value="/upload" placeholder="/upload" style="width:120px;font-size:12px;padding:5px 8px">
  <button class="mini" onclick="loadSample()">载入示例</button>
  <button class="mini danger" onclick="resetAll()">清空</button>
  <button class="primary" onclick="copyJSON()">复制 JSON</button>
  <button class="primary" onclick="downloadJSON()">下载 JSON</button>
</header>

<main>
  <section class="panel">
    <h2>① 消息类型 <span class="tag">选择后下方字段随之变化</span></h2>
    <div class="seg" id="typeSeg"></div>
    <div id="editor"></div>
  </section>

  <section class="panel">
    <h2>② 卡片预览</h2>
    <div class="preview-wrap" id="preview"></div>
    <h2 style="margin-top:18px">③ 生成的 JSON</h2>
    <pre class="json" id="json"></pre>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
 * 状态
 * =======================================================*/
const TYPES = [
  {id:'text',          label:'text 文本'},
  {id:'markdown',      label:'markdown'},
  {id:'markdown_v2',   label:'markdown_v2'},
  {id:'news',          label:'news 图文'},
  {id:'image',         label:'image 图片'},
  {id:'card_text',     label:'卡片 · 文本通知'},
  {id:'card_news',     label:'卡片 · 图文展示'},
];

let state = {
  type: 'card_text',
  _imgPreview: {},          // 本地选图预览，不进入导出 JSON
  _upload: {enabled:false, endpoint:'/upload'},
  text: {content:'', mentioned_list:''},
  markdown: {content:'# 标题\n**加粗** 和 [链接](https://example.com)\n> 引用文字'},
  markdown_v2: {content:'# 标题\n- 列表项 1\n- 列表项 2\n\n| 列A | 列B |\n| --- | --- |\n| 1 | 2 |'},
  news: {articles:[{title:'', description:'', url:'', picurl:''}]},
  image: {base64:'', md5:''},
  card_text: {
    source:{desc:'Gitea', desc_color:0, icon_url:''},
    main_title:{title:'📦 代码推送', desc:'owner/repo'},
    emphasis_content:{title:'3', desc:'次提交'},
    quote_area:{title:'分支 main', quote_text:'abc1234 fix bug'},
    sub_title_text:'',
    horizontal_content_list:[{keyname:'仓库', value:'owner/repo'}, {keyname:'推送者', value:'alice'}],
    jump_list:[{title:'查看对比', url:'https://example.com/compare'}],
    card_action:{type:1, url:'https://example.com/compare'},
  },
  card_news: {
    source:{desc:'Gitea Release', desc_color:3, icon_url:''},
    main_title:{title:'🏷️ Release 发布', desc:'v1.0.0'},
    card_image:{url:'https://docs.gitea.com/img/logo.svg', aspect_ratio:1.5},
    image_text_area:{title:'', desc:'', image_url:'', type:1, url:''},
    vertical_content_list:[{title:'更新内容', desc:'修复若干问题'}],
    horizontal_content_list:[{keyname:'仓库', value:'owner/repo'}],
    jump_list:[{title:'查看 Release', url:'https://example.com/release'}],
    card_action:{type:1, url:'https://example.com/release'},
  },
};

/* =========================================================
 * 工具
 * =======================================================*/
const $ = s => document.querySelector(s);
function esc(s){return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}
function bind(obj, path, value){
  const parts = path.split('.'); let cur = obj;
  for(let i=0;i<parts.length-1;i++){ if(cur[parts[i]]==null) cur[parts[i]]={}; cur=cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}
function get(obj, path){ return path.split('.').reduce((a,k)=> (a==null?undefined:a[k]), obj); }

/* =========================================================
 * 上传配置
 * =======================================================*/
function toggleUpload(){
  state._upload.enabled = $('#uploadEnabled').checked;
  renderEditor();
}
function onEndpointChange(v){ state._upload.endpoint = v || '/upload'; }

/* =========================================================
 * 类型切换
 * =======================================================*/
function renderTypeSeg(){
  $('#typeSeg').innerHTML = TYPES.map(t=>
    `<button class="${state.type===t.id?'active':''}" onclick="switchType('${t.id}')">${t.label}</button>`
  ).join('');
}
function switchType(id){ state.type = id; renderEditor(); renderAll(); }

/* =========================================================
 * 通用输入
 * =======================================================*/
function input(label, path, opts={}){
  const val = get(state, path) ?? '';
  const ph = opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : '';
  const type = opts.type || 'text';
  return `<label>${esc(label)}</label>
    <input type="${type}" value="${esc(val)}" ${ph}
      oninput="bind(state,'${path}', this.value===''?'':this.value); renderAll()">`;
}
function textarea(label, path, rows=4){
  const val = get(state, path) ?? '';
  return `<label>${esc(label)}</label>
    <textarea rows="${rows}" oninput="bind(state,'${path}', this.value); renderAll()">${esc(val)}</textarea>`;
}

/* 通用图片输入：URL + 本地预览 + 可选上传换 URL */
function imgInput(label, path, opts={}){
  const val = get(state, path) ?? '';
  const preview = (state._imgPreview && state._imgPreview[path]) || val;
  const previewHtml = preview
    ? `<img src="${esc(preview)}" alt="">`
    : `<div class="ph">无图</div>`;
  const uploadable = opts.uploadable !== false;
  const uploadBtn = uploadable
    ? `<input type="file" accept="image/png,image/jpeg" onchange="onPickCardImage(this, '${path}')">`
    : '';
  const hint = opts.hint ? `<div class="hint">${esc(opts.hint)}</div>` : '';
  return `
    <label>${esc(label)}</label>
    <div class="imgpick">
      ${previewHtml}
      <div style="flex:1;min-width:0">
        <input type="url" value="${esc(val)}" placeholder="https://..."
          oninput="bind(state,'${path}',this.value); renderAll()">
        ${uploadBtn}
        ${hint}
      </div>
    </div>`;
}

/* =========================================================
 * 编辑器
 * =======================================================*/
function renderEditor(){
  const t = state.type;
  let html = '';

  if(t==='text'){
    html += textarea('content（≤2048字节）', 'text.content', 5);
    html += input('mentioned_list（逗号分隔 userid，可填 @all）', 'text.mentioned_list', {placeholder:'wangqing,@all'});
  }
  else if(t==='markdown'){ html += textarea('content（≤4096字节）', 'markdown.content', 8); }
  else if(t==='markdown_v2'){ html += textarea('content（≤4096字节）', 'markdown_v2.content', 10); }
  else if(t==='news'){
    html += `<div class="items">`;
    state.news.articles.forEach((a,i)=>{
      html += `<div class="sub">
        <div class="sub-head"><b>文章 ${i+1}</b>
          ${state.news.articles.length>1?`<button class="mini danger" onclick="removeArticle(${i})">删除</button>`:''}
        </div>
        ${input('标题（≤128字节）', `news.articles.${i}.title`)}
        ${input('描述（≤512字节）', `news.articles.${i}.description`)}
        ${input('跳转 URL', `news.articles.${i}.url`, {type:'url'})}
        ${imgInput('图片 URL', `news.articles.${i}.picurl`, {hint:'图文消息图片为公网 URL'})}
      </div>`;
    });
    html += `</div><div class="toolbar"><button class="mini" onclick="addArticle()">+ 添加文章</button></div>`;
  }
  else if(t==='image'){
    html += `<label>上传图片（JPG/PNG，≤2M）</label>
      <div class="imgpick">
        <input type="file" accept="image/png,image/jpeg" onchange="onPickImage(this)">
        ${state.image.base64?`<img src="data:image/png;base64,${state.image.base64}">`:`<div class="ph">无图</div>`}
      </div>
      <div class="hint">base64 会自动填入；md5 建议由后端计算（浏览器无内置 md5）。</div>`;
  }
  else if(t==='card_text'){
    html += input('来源描述 source.desc（≤13字）', 'card_text.source.desc');
    html += `<div class="row">${input('来源颜色 0灰/1黑/2红/3绿', 'card_text.source.desc_color', {type:'number'})}</div>`;
    html += imgInput('来源图标 source.icon_url（可选）', 'card_text.source.icon_url', {hint:'可选，建议小图'});
    html += `<div class="row">${input('主标题 main_title.title（≤26字）', 'card_text.main_title.title')}${input('标题辅助 main_title.desc（≤30字）', 'card_text.main_title.desc')}</div>`;
    html += `<div class="row">${input('关键数据 emphasis.title（≤10字）', 'card_text.emphasis_content.title')}${input('关键数据说明 emphasis.desc（≤15字）', 'card_text.emphasis_content.desc')}</div>`;
    html += input('引用标题 quote_area.title', 'card_text.quote_area.title');
    html += textarea('引用文案 quote_area.quote_text', 'card_text.quote_area.quote_text', 2);
    html += textarea('二级文本 sub_title_text（≤112字，与主标题至少填一）', 'card_text.sub_title_text', 2);
    html += renderHList('card_text');
    html += renderJList('card_text');
    html += `<label>整体跳转 card_action.url（必填）</label>
      <input type="url" value="${esc(state.card_text.card_action.url)}"
        oninput="bind(state,'card_text.card_action.url',this.value); renderAll()">`;
  }
  else if(t==='card_news'){
    html += input('来源描述 source.desc（≤13字）', 'card_news.source.desc');
    html += `<div class="row">${input('来源颜色 0灰/1黑/2红/3绿', 'card_news.source.desc_color', {type:'number'})}</div>`;
    html += imgInput('来源图标 source.icon_url（可选）', 'card_news.source.icon_url');
    html += `<div class="row">${input('主标题 main_title.title（必填，≤26字）', 'card_news.main_title.title')}${input('标题辅助 main_title.desc（≤30字）', 'card_news.main_title.desc')}</div>`;
    html += imgInput('封面图 card_image.url（必填，建议 1068×455）', 'card_news.card_image.url', {hint:'企业微信要求为公网 URL'});
    html += `<div class="row">${input('封面宽高比 1.3~2.25', 'card_news.card_image.aspect_ratio', {type:'number'})}</div>`;
    html += `<div class="sub"><div class="sub-head"><b>左图右文 image_text_area（可选）</b></div>
      ${input('标题', 'card_news.image_text_area.title')}
      ${input('描述', 'card_news.image_text_area.desc')}
      ${imgInput('图片 URL', 'card_news.image_text_area.image_url')}
      ${input('点击 URL', 'card_news.image_text_area.url', {type:'url'})}
    </div>`;
    html += renderVList('card_news');
    html += renderHList('card_news');
    html += renderJList('card_news');
    html += `<label>整体跳转 card_action.url（必填）</label>
      <input type="url" value="${esc(state.card_news.card_action.url)}"
        oninput="bind(state,'card_news.card_action.url',this.value); renderAll()">`;
  }

  $('#editor').innerHTML = html;
}

/* ---- 卡片子列表 ---- */
function renderHList(root){
  const arr = state[root].horizontal_content_list || [];
  let h = `<div class="sub"><div class="sub-head"><b>二级列表 horizontal_content_list（≤6）</b>
    <button class="mini" onclick="addH('${root}')">+ 添加</button></div>`;
  arr.forEach((it,i)=>{
    h += `<div class="row3">
      <input type="text" placeholder="keyname" value="${esc(it.keyname)}"
        oninput="bind(state,'${root}.horizontal_content_list.${i}.keyname',this.value); renderAll()">
      <input type="text" placeholder="value" value="${esc(it.value)}"
        oninput="bind(state,'${root}.horizontal_content_list.${i}.value',this.value); renderAll()">
      <button class="mini danger" onclick="rmH('${root}',${i})">删除</button>
    </div>`;
  });
  return h + `</div>`;
}
function renderJList(root){
  const arr = state[root].jump_list || [];
  let h = `<div class="sub"><div class="sub-head"><b>跳转列表 jump_list（≤3）</b>
    <button class="mini" onclick="addJ('${root}')">+ 添加</button></div>`;
  arr.forEach((it,i)=>{
    h += `<div class="row3">
      <input type="text" placeholder="title" value="${esc(it.title)}"
        oninput="bind(state,'${root}.jump_list.${i}.title',this.value); renderAll()">
      <input type="url" placeholder="url" value="${esc(it.url)}"
        oninput="bind(state,'${root}.jump_list.${i}.url',this.value); renderAll()">
      <button class="mini danger" onclick="rmJ('${root}',${i})">删除</button>
    </div>`;
  });
  return h + `</div>`;
}
function renderVList(root){
  const arr = state[root].vertical_content_list || [];
  let h = `<div class="sub"><div class="sub-head"><b>垂直内容 vertical_content_list（≤4）</b>
    <button class="mini" onclick="addV('${root}')">+ 添加</button></div>`;
  arr.forEach((it,i)=>{
    h += `<div class="row3">
      <input type="text" placeholder="title" value="${esc(it.title)}"
        oninput="bind(state,'${root}.vertical_content_list.${i}.title',this.value); renderAll()">
      <input type="text" placeholder="desc" value="${esc(it.desc)}"
        oninput="bind(state,'${root}.vertical_content_list.${i}.desc',this.value); renderAll()">
      <button class="mini danger" onclick="rmV('${root}',${i})">删除</button>
    </div>`;
  });
  return h + `</div>`;
}

/* ---- 增删 ---- */
function addH(r){ state[r].horizontal_content_list.push({keyname:'',value:''}); renderEditor(); renderAll(); }
function rmH(r,i){ state[r].horizontal_content_list.splice(i,1); renderEditor(); renderAll(); }
function addJ(r){ state[r].jump_list.push({title:'',url:''}); renderEditor(); renderAll(); }
function rmJ(r,i){ state[r].jump_list.splice(i,1); renderEditor(); renderAll(); }
function addV(r){ state[r].vertical_content_list.push({title:'',desc:''}); renderEditor(); renderAll(); }
function rmV(r,i){ state[r].vertical_content_list.splice(i,1); renderEditor(); renderAll(); }
function addArticle(){ state.news.articles.push({title:'',description:'',url:'',picurl:''}); renderEditor(); renderAll(); }

/* =========================================================
 * 图片处理
 * =======================================================*/
/* image 消息类型：本地转 base64 内嵌 */
function onPickImage(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ toast('图片超过 2M'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    state.image.base64 = reader.result.split(',')[1];
    state.image.md5 = '(请用后端计算 md5)';
    renderEditor(); renderAll();
  };
  reader.readAsDataURL(file);
}

/* 卡片/图文图片：本地预览 + 可选上传换 URL */
async function onPickCardImage(input, path){
  const file = input.files && input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ toast('图片超过 2M'); return; }

  // 先本地预览
  const reader = new FileReader();
  reader.onload = () => {
    state._imgPreview = state._imgPreview || {};
    state._imgPreview[path] = reader.result;
    renderEditor(); renderAll();
  };
  reader.readAsDataURL(file);

  // 若启用上传，则上传并自动填 URL
  if(state._upload.enabled){
    try{
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch(state._upload.endpoint || '/upload', {method:'POST', body:fd});
      const j = await r.json();
      if(j && j.ok && j.url){
        bind(state, path, j.url);
        toast('已上传并填入 URL');
        renderEditor(); renderAll();
      } else {
        toast('上传失败：' + ((j && j.msg) || r.status));
      }
    }catch(e){
      toast('上传失败，仅本地预览');
    }
  } else {
    toast('已本地预览（未启用上传）');
  }
}

/* =========================================================
 * 预览
 * =======================================================*/
function pickImg(urlPath){
  return (state._imgPreview && state._imgPreview[urlPath]) || get(state, urlPath) || '';
}

function renderPreview(){
  const t = state.type;
  const el = $('#preview');

  if(t==='card_text' || t==='card_news'){
    const c = state[t];
    const isNews = t==='card_news';
    let h = `<div class="wx-card">`;
    if(c.source && (c.source.desc || c.source.icon_url)){
      const icon = pickImg(`${t}.source.icon_url`);
      h += `<div class="src">${icon?`<img src="${esc(icon)}" style="width:14px;height:14px;border-radius:3px">`:`<span class="dot"></span>`}${esc(c.source.desc||'')}</div>`;
    }
    if(isNews){
      const cover = pickImg('card_news.card_image.url');
      if(cover) h += `<img class="cardimg" src="${esc(cover)}" alt="">`;
    }
    h += `<div class="body">`;
    if(c.main_title?.title) h += `<div class="title">${esc(c.main_title.title)}</div>`;
    if(c.main_title?.desc) h += `<div class="desc">${esc(c.main_title.desc)}</div>`;
    if(!isNews && c.emphasis_content?.title){
      h += `<div class="emphasis"><div class="num">${esc(c.emphasis_content.title)}</div><div class="cap">${esc(c.emphasis_content.desc||'')}</div></div>`;
    }
    if(!isNews && c.sub_title_text) h += `<div class="subtitle">${esc(c.sub_title_text)}</div>`;
    if(!isNews && (c.quote_area?.quote_text || c.quote_area?.title)){
      h += `<div class="quote">${c.quote_area.title?`<div class="qt">${esc(c.quote_area.title)}</div>`:''}${esc(c.quote_area.quote_text||'')}</div>`;
    }
    if(isNews){
      const ita = pickImg('card_news.image_text_area.image_url');
      if(ita){
        h += `<div class="ita"><img src="${esc(ita)}"><div><div class="t">${esc(c.image_text_area.title||'')}</div><div class="d">${esc(c.image_text_area.desc||'')}</div></div></div>`;
      }
      if(c.vertical_content_list?.length){
        h += `<div class="vlist">`;
        c.vertical_content_list.forEach(v=>{
          h += `<div class="vrow"><div class="vt">${esc(v.title||'')}</div><div class="vd">${esc(v.desc||'')}</div></div>`;
        });
        h += `</div>`;
      }
    }
    if(c.horizontal_content_list?.length){
      h += `<div class="hlist">`;
      c.horizontal_content_list.forEach(v=>{
        h += `<div class="hrow"><span class="k">${esc(v.keyname||'')}</span><span class="v">${esc(v.value||'')}</span></div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
    if(c.jump_list?.length){
      h += `<div class="jlist">`;
      c.jump_list.forEach(j=> h += `<a href="javascript:void(0)">${esc(j.title||'链接')}</a>`);
      h += `</div>`;
    }
    h += `</div>`;
    el.innerHTML = h;
    return;
  }

  if(t==='news'){
    el.innerHTML = state.news.articles.map((a,i)=>{
      const pic = pickImg(`news.articles.${i}.picurl`);
      return `<div class="wx-card" style="margin-bottom:10px">
        ${pic?`<img class="cardimg" src="${esc(pic)}">`:''}
        <div class="body">
          <div class="title">${esc(a.title||'(无标题)')}</div>
          <div class="desc">${esc(a.description||'')}</div>
        </div>
      </div>`;
    }).join('');
    return;
  }

  if(t==='image'){
    if(state.image.base64){
      el.innerHTML = `<img class="wx-img" src="data:image/png;base64,${state.image.base64}">`;
    } else {
      el.innerHTML = `<div class="empty">请上传一张图片</div>`;
    }
    return;
  }

  const raw = state[t].content || '';
  el.innerHTML = `<div class="wx-md">${miniMarkdown(raw)}</div>`;
}

function miniMarkdown(src){
  let s = esc(src);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<span class="mcode">$1</span>');
  s = s.replace(/\[(.+?)\]\((.+?)\)/g, '<span class="mlink">$1</span>');
  s = s.replace(/<font color="info">(.+?)<\/font>/g, '<span class="mgreen">$1</span>');
  s = s.replace(/<font color="comment">(.+?)<\/font>/g, '<span class="mgray">$1</span>');
  s = s.replace(/<font color="warning">(.+?)<\/font>/g, '<span class="mred">$1</span>');
  s = s.replace(/^&gt; (.*)$/gm, '<span class="mquote">$1</span>');
  return s;
}

/* =========================================================
 * 生成 JSON
 * =======================================================*/
function buildJSON(){
  const t = state.type;
  if(t==='text'){
    const o = {msgtype:'text', text:{content: state.text.content}};
    const ml = (state.text.mentioned_list||'').trim();
    if(ml) o.text.mentioned_list = ml.split(',').map(x=>x.trim()).filter(Boolean);
    return o;
  }
  if(t==='markdown')     return {msgtype:'markdown', markdown:{content: state.markdown.content}};
  if(t==='markdown_v2')  return {msgtype:'markdown_v2', markdown_v2:{content: state.markdown_v2.content}};
  if(t==='news')         return {msgtype:'news', news:{articles: state.news.articles.map(a=>({...a}))}};
  if(t==='image')        return {msgtype:'image', image:{base64: state.image.base64, md5: state.image.md5}};
  if(t==='card_text' || t==='card_news'){
    const c = JSON.parse(JSON.stringify(state[t]));
    cleanEmpty(c);
    if(!c.card_action || !c.card_action.url){
      c.card_action = {type:1, url: c.card_image?.url || 'https://example.com'};
    }
    return {msgtype:'template_card', template_card:{
      card_type: t==='card_text' ? 'text_notice' : 'news_notice',
      ...c
    }};
  }
  return {};
}
function cleanEmpty(obj){
  Object.keys(obj).forEach(k=>{
    const v = obj[k];
    if(v==='' || v==null){ delete obj[k]; return; }
    if(Array.isArray(v)){
      obj[k] = v.filter(it=> !(it && typeof it==='object' && Object.values(it).every(x=>x===''||x==null)));
      if(obj[k].length===0) delete obj[k];
      else obj[k].forEach(cleanEmpty);
    } else if(typeof v==='object'){ cleanEmpty(v); if(Object.keys(v).length===0) delete obj[k]; }
  });
}

/* =========================================================
 * 主渲染
 * =======================================================*/
function renderAll(){
  renderPreview();
  $('#json').textContent = JSON.stringify(buildJSON(), null, 2);
}

/* =========================================================
 * 顶部按钮
 * =======================================================*/
function copyJSON(){
  const txt = $('#json').textContent;
  navigator.clipboard.writeText(txt).then(()=>toast('已复制 JSON'), ()=>toast('复制失败，请手动选择'));
}
function downloadJSON(){
  const blob = new Blob([$('#json').textContent], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `wecom-${state.type}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已下载');
}
function resetAll(){
  if(!confirm('确定清空当前内容？')) return;
  location.reload();
}
