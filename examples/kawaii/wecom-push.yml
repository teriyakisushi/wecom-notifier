# 猫娘风格 push 通知 —— 图文卡片（template_card / news_notice）
#
# 用法：复制到 .github/wecom-notify/wecom-push.yml，workflow 里加 template-dir 即可。
# 图片：safebooru 公开直链（rating:safe，1280x720，ratio 1.78），
#       企业微信要求 card_image.aspect_ratio 落在 (1.3, 2.25)，1.78 刚好合规。

msgtype: template_card

template_card:
  card_type: news_notice

  source:
    desc: "🐾 喵喵电台"
    desc_color: 3

  main_title:
    title: "🐱 主人～新爪印掉下来啦喵！"
    desc: "{{ actor | truncate(12) }} 在 {{ ref_name | truncate(14) }} 踩了一爪"

  card_image:
    url: "https://safebooru.org/images/854/fa20e9837540717cda2743d5cad4ff81.png"
    aspect_ratio: 1.78

  image_text_area:
    type: 1
    url: "{{ compare_url | default(repo.html_url) }}"
    title: "💖 点这里看猫猫叼来的改动"
    desc: "{{ head_commit.first_line | default('这次没有新提交喵…') | truncate(80) }}"
    image_url: "https://safebooru.org/images/854/fa20e9837540717cda2743d5cad4ff81.png"

  # 没有提交（分支创建 / 空推）时整块消失，避免空 quote_text 被校验拦下。
  quote_area:
    $if: commit_count > 0
    type: 1
    url: "{{ compare_url | default(repo.html_url) }}"
    title: "📮 猫猫把提交叼过来啦"
    quote_text:
      $each: commits
      $limit: 4
      $join: "\n"
      $item: "• {{ item.first_line | default(item.short_sha) | truncate(58) }}"

  horizontal_content_list:
    - keyname: 仓库
      value: "{{ repo.full_name | truncate(24) }}"
    - keyname: 分支
      value: "{{ ref_name | default('?') }}"
    - keyname: 爪印数
      value: "{{ commit_count }} 个提交"
    - keyname: 推爪子的人
      value: "{{ actor }}"

  jump_list:
    - title: 对比喵
      url: "{{ compare_url | default(repo.html_url) }}"
    - title: 看提交
      url: "{{ commit_url | default(repo.html_url) }}"
    - title: 仓库
      url: "{{ repo.html_url }}"

  card_action:
    type: 1
    url: "{{ compare_url | default(repo.html_url) }}"
