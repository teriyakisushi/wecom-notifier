# 猫娘风格 CI 通知 —— 图文卡片（template_card / news_notice）
#
# 事件：workflow_run（配合 on.workflow_run.types: [completed]）
# 图片：safebooru 公开直链（rating:safe，1600x900，ratio 1.78）
# 分支文案用 $if 挂在数组元素上，条件不成立的那一行会被剪掉，
# 所以成功 / 失败 / 取消 / 还在跑 各自只会出现对应的那句猫娘台词。

msgtype: template_card

template_card:
  card_type: news_notice

  source:
    desc: "🐾 喵喵 CI 站"
    desc_color: 1

  main_title:
    title: "🐱 CI 出炉啦，主人快验收喵～"
    desc: "{{ workflow | default('Workflow') | truncate(16) }} · {{ workflow_run.head_branch | default(ref_name) | truncate(8) }}"

  card_image:
    url: "https://safebooru.org/images/592/b50779324dec27143ae2c51ecd7fbfca.jpeg"
    aspect_ratio: 1.78

  vertical_content_list:
    - $if: workflow_run.conclusion == "success"
      title: "✨ 全绿通过喵！"
      desc: "尾巴翘起来啦～主人的代码香香的，奖励一个呼噜噜。"
    - $if: workflow_run.conclusion == "failure"
      title: "🥲 红啦…失败喵"
      desc: "耳朵垂下来惹…点开运行日志，猫猫陪你一起修！"
    - $if: workflow_run.conclusion == "cancelled" || workflow_run.conclusion == "timed_out"
      title: "💤 被打断了喵"
      desc: "被取消或者超时了，重新跑一遍说不定就绿了喵～"
    - $if: workflow_run.status == "in_progress" || workflow_run.status == "queued"
      title: "🏃 猫猫还在跑…"
      desc: "爪子在键盘上飞，再等一下下嘛喵。"

  horizontal_content_list:
    - keyname: 分支
      value: "{{ workflow_run.head_branch | default(ref_name) | default('?') }}"
    - keyname: 结果
      value: "{{ workflow_run.conclusion | default(workflow_run.status) | default('unknown') }}"
    - keyname: 触发
      value: "{{ workflow_run.event | default(event_name) }}"
    - keyname: 第几次
      value: "{{ workflow_run.run_number | default(run_number) | default('?') }}"

  quote_area:
    $if: workflow_run.head_commit
    type: 1
    url: "{{ workflow_run.html_url | default(run_url) }}"
    title: "📮 猫猫叼来的那次提交"
    quote_text: "{{ workflow_run.head_commit.message | firstLine | truncate(180) }}"

  jump_list:
    - title: 运行日志
      url: "{{ workflow_run.html_url | default(run_url) }}"
    - title: 看提交
      url: "{{ repo.html_url }}/commit/{{ workflow_run.head_sha | default(sha) }}"
    - title: 仓库
      url: "{{ repo.html_url }}"

  card_action:
    type: 1
    url: "{{ workflow_run.html_url | default(run_url) }}"
