name: WeCom inline payload

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: teriyakiushi/dmao-wecom-notifier@v1
        with:
          webhook: ${{ secrets.WECOM_WEBHOOK }}
          payload: |
            msgtype: markdown
            markdown:
              content: |
                ### 🚀 部署完成
                > 仓库：${{ github.repository }}
                > 提交：${{ github.sha }}
                > 触发者：${{ github.actor }}
